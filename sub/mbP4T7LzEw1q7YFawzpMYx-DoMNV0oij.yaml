port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: warning
ipv6: false

dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  listen: 0.0.0.0:1053
  use-hosts: true
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  respect-rules: true
  nameserver:
    - "https://cloudflare-dns.com/dns-query#自动切换"
    - "https://dns.google/dns-query#自动切换"
  proxy-server-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localhost"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "localhost.ptlogin2.qq.com"
    - "+.srv.nintendo.net"
    - "+.stun.playstation.net"
    - "+.apple.com"
    - "+.cdn.apple.com"
    - "+.huhiuh.space"

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - any:53
    - tcp://any:53

proxies:
  - name: "菲律宾-马尼拉-HY2-线路3"
    type: hysteria2
    server: 138.252.80.42
    port: 43320
    password: "user325_mac:1118328d-1a6d-477f-8236-56b19efbdc48"
    sni: www.bing.com
    skip-cert-verify: true
    udp: true
  - name: "菲律宾-马尼拉-HY2-线路1"
    type: hysteria2
    server: 138.252.80.42
    port: 43320
    password: "user325_mac:1118328d-1a6d-477f-8236-56b19efbdc48"
    sni: www.bing.com
    skip-cert-verify: true
    udp: true

proxy-groups:
  - name: "自动切换"
    type: fallback
    proxies:
      - "菲律宾-马尼拉-HY2-线路3"
      - "菲律宾-马尼拉-HY2-线路1"
    interval: 5
    timeout: 8000
    lazy: false
    url: https://www.gstatic.com/generate_204

rules:
  - DOMAIN-SUFFIX,stun.playstation.net,DIRECT
  - DST-PORT,3478,REJECT
  - DST-PORT,19302,REJECT
  - DST-PORT,19305,REJECT
  - DST-PORT,5349,REJECT
  - DOMAIN-KEYWORD,stun,REJECT
  - DOMAIN-KEYWORD,turn,REJECT
  - DOMAIN-SUFFIX,huhiuh.space,DIRECT
  - GEOSITE,private,DIRECT
  - GEOSITE,cn,DIRECT
  - GEOSITE,geolocation-!cn,自动切换
  - GEOIP,private,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,自动切换
